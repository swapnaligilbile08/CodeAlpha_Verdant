{% extends "base.html" %} {% block title %}Reset Password — Verdant{% endblock %} {% block content %}
<div class="container">
  <form method="post" class="form-card" novalidate>
    {% csrf_token %}
    <h2>Reset your password</h2>
    <p class="helptext" style="margin-top: -6px; margin-bottom: 18px">
      Enter the email on your account and we'll send a link to reset your
      password.
    </p>
    <div class="field">
      <label for="{{ form.email.id_for_label }}">Email</label>
      {{ form.email }} {{ form.email.errors }}
    </div>
    <button type="submit" class="btn btn-primary btn-block">
      Send reset link
    </button>
    <p style="text-align: center; margin-top: 16px">
      <a
        href="{% url 'store:login' %}"
        style="color: var(--forest); font-weight: 700"
        >Back to log in</a
      >
    </p>
  </form>
</div>
{% endblock %}
